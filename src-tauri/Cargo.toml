[package]
name = "tauri-bluetooth-tool"
version = "0.3.3"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_bluetooth_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.5", features = ["devtools"] }
tauri-plugin-blec = "0.12.0"
uuid = "1.26.0"
tauri-plugin-dialog = "2.7.3"
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["full"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
futures = "0.3.34"
tauri-plugin-fs = "2.5.2"
tauri-plugin-log = { version = "2.9.1", features = ["colored"] }
log = "0.4.34"
tauri-plugin-opener = "2.5.5"

# Upstream tauri-plugin-blec 0.12.0 panics when Android delivers a late
# notification after its Rust receiver has been closed.
[patch.crates-io]
tauri-plugin-blec = { path = "vendor/tauri-plugin-blec" }
